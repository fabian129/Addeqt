<!doctype html>
<!--
  ADDEQT — hero-mockup. Speglar live-heron (Hero.tsx) exakt, men bakgrunden är TVÅ bilder
  delade HÖRN TILL HÖRN diagonalt (enligt Christoffers skiss), som lugnt alternerar en åt gången.
  Inget guld, ingen pill-nav, ingen zoom. Porteras till Hero.tsx efter OK.
-->
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AddEqt — Hero-mockup (diagonal, hörn till hörn)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{ --ink:#0F0F10;
    --font-display:'Manrope',-apple-system,sans-serif;
    --font-mono:'JetBrains Mono',monospace;
    --ease:cubic-bezier(0.16,1,0.3,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font-display);background:var(--ink);color:#fff;-webkit-font-smoothing:antialiased;overflow:hidden}

  .hero{position:relative;height:100vh;min-height:750px;overflow:hidden}

  /* ── Bakgrund: två bilder, delade hörn-till-hörn (övre-höger → nedre-vänster) ── */
  .stage{position:absolute;inset:0;z-index:1}
  .panel{position:absolute;inset:0;overflow:hidden}
  .panel[data-panel="a"]{clip-path:polygon(0 0, 100% 0, 0 100%)}   /* övre vänstra triangeln */
  .panel[data-panel="b"]{clip-path:polygon(100% 0, 100% 100%, 0 100%)} /* nedre högra triangeln */
  .frame{position:absolute;inset:0;opacity:0;transition:opacity 2.6s ease-in-out}
  .frame.is-active{opacity:1}
  .frame img{width:100%;height:100%;object-fit:cover}   /* ingen zoom — lugnt */

  /* ── Cinematiska overlays (exakt som Hero.tsx) ── */
  .grad{position:absolute;inset:0;z-index:2;pointer-events:none}
  .grad.lr{background:linear-gradient(to right,rgba(15,15,16,.65) 0%,rgba(15,15,16,.2) 50%,rgba(15,15,16,.4) 100%)}
  .grad.tb{background:linear-gradient(to bottom,rgba(15,15,16,.3) 0%,rgba(15,15,16,.05) 40%,rgba(15,15,16,.6) 90%,rgba(15,15,16,.85) 100%)}

  /* ── Layout (exakt som Hero.tsx) ── */
  .hero-layout{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:space-between;
    padding:clamp(7rem,12vh,10rem) clamp(2rem,8vw,12rem) clamp(2rem,4vh,3rem)}
  .mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:clamp(5rem,14vh,11rem)}

  .eyebrow{display:flex;align-items:center;gap:.6rem;margin-bottom:1.5rem}
  .eyebrow .tag{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6)}
  .eyebrow .sep{color:rgba(255,255,255,.3);font-size:11px}

  h1{font-weight:300;line-height:1.1;letter-spacing:-.02em;color:#fff;margin:0;max-width:800px;
    font-size:clamp(2rem,4.5vw,4.5rem);text-shadow:0 4px 60px rgba(0,0,0,.6)}
  .sub{font-weight:300;line-height:1.6;color:rgba(255,255,255,.75);max-width:500px;margin-top:1.5rem;
    font-size:clamp(16px,1.25vw,20px);text-shadow:0 2px 20px rgba(0,0,0,.5)}

  /* ── Botten-nav (exakt som Hero.tsx) ── */
  .bottom-nav{display:flex;justify-content:flex-end;align-self:flex-end;gap:clamp(2.5rem,5vw,6rem);
    border-bottom:1px solid rgba(255,255,255,.2);padding-bottom:clamp(1.5rem,3vh,2.5rem)}
  .nav-item{display:flex;align-items:center;gap:1rem;text-decoration:none;cursor:pointer;
    opacity:.8;transition:opacity .7s var(--ease)}
  .bottom-nav:hover .nav-item{opacity:.3}
  .bottom-nav .nav-item:hover{opacity:1}
  .nav-title{font-size:clamp(.85rem,1.1vw,1rem);font-weight:300;color:#fff;text-transform:uppercase;letter-spacing:.18em;
    transition:transform .7s var(--ease)}
  .nav-item:hover .nav-title{transform:translateX(4px)}
  .nav-arrow{width:16px;height:16px;color:#fff;opacity:.3;transition:all .7s var(--ease)}
  .nav-item:hover .nav-arrow{opacity:1;transform:translateX(4px)}

  @media(max-width:900px){
    .hero-layout{padding-left:clamp(1.5rem,5vw,3rem);padding-right:clamp(1.5rem,5vw,3rem)}
    .panel[data-panel="a"]{clip-path:none}     /* mobil: ett rent bildfält */
    .panel[data-panel="b"]{display:none}
    .streck{display:none}
    .bottom-nav{flex-direction:column;gap:1.5rem}
    .nav-item{justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:1.5rem}
  }

  /* Lugnt först — reduced-motion: ingen växling */
  @media(prefers-reduced-motion:reduce){ .frame{transition:none} }
</style>
</head>
<body>
  <section class="hero">
    <div class="stage">
      <div class="panel" data-panel="a">
        <div class="frame is-active"><img src="images/pexels-mlkbnl-28267152.jpg" alt=""></div>
        <div class="frame"><img src="images/hero-positano.jpg" alt=""></div>
        <div class="frame"><img src="images/aerial-view-harbor-town-yachts-monaco-city.jpg" alt=""></div>
        <div class="frame"><img src="images/pexels-mlkbnl-28267040.jpg" alt=""></div>
        <div class="frame"><img src="images/pexels-mlkbnl-28267168.jpg" alt=""></div>
      </div>
      <div class="panel" data-panel="b">
        <div class="frame is-active"><img src="images/pexels-mlkbnl-28266998.jpg" alt=""></div>
        <div class="frame"><img src="images/hero-sailing.png" alt=""></div>
        <div class="frame"><img src="images/scenic-view-sea-against-sky-with-boat-lake-como.jpg" alt=""></div>
        <div class="frame"><img src="images/pexels-mlkbnl-28267250.jpg" alt=""></div>
        <div class="frame"><img src="images/view-from-terrace-positano-town-beach-amalfi-coast-italy.jpg" alt=""></div>
      </div>
    </div>

    <div class="grad lr"></div>
    <div class="grad tb"></div>

    <div class="hero-layout">
      <div class="mid">
        <div class="eyebrow">
          <span class="tag">Oberoende</span><span class="sep">·</span>
          <span class="tag">Stockholm</span><span class="sep">·</span>
          <span class="tag">FI-tillstånd</span>
        </div>
        <h1>Vårt oberoende är fundamentet i allt vi gör.</h1>
        <p class="sub">Inga egna fonder. Inga dolda incitament. Bara ren, skräddarsydd rådgivning på dina villkor.</p>
      </div>

      <nav class="bottom-nav">
        <a class="nav-item" href="#"><span class="nav-title">Tjänster</span><svg class="nav-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a>
        <a class="nav-item" href="#"><span class="nav-title">Om Addeqt</span><svg class="nav-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a>
        <a class="nav-item" href="#"><span class="nav-title">Vår Process</span><svg class="nav-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a>
        <a class="nav-item" href="#"><span class="nav-title">Kontakt</span><svg class="nav-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a>
      </nav>
    </div>
  </section>

<script>
  // Lugn alternering: en triangel åt gången tonar mellan sina två bilder.
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce){
    var panels = Array.prototype.map.call(document.querySelectorAll('.panel'), function(p){
      return { frames: p.querySelectorAll('.frame'), i: 0 };
    });
    var turn = 0;
    setInterval(function(){
      var p = panels[turn % panels.length];
      if (p && p.frames.length > 1){
        p.frames[p.i].classList.remove('is-active');
        p.i = (p.i + 1) % p.frames.length;
        p.frames[p.i].classList.add('is-active');
      }
      turn++;
    }, 5000); // → varje triangel byter ~var 10:e sekund, aldrig samtidigt
  }
</script>
</body>
</html>
